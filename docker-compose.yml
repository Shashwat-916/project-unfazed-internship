version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: unfazed_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: unfazed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unfazed-network

  redis:
    image: redis:7-alpine
    container_name: unfazed_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unfazed-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: unfazed_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - unfazed-network


networks:
  unfazed-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
version: "3.8"

services:
  
  redis:
    image: redis:7-alpine
    container_name: unfazed_redis
    ports:
      - "6379:6379"
    
  minio:
    image: quay.io/minio/minio
    container_name: unfazed_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=unfazedadmin
      - MINIO_ROOT_PASSWORD=unfazedadmin123
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - unfazed_minio_data:/data

volumes:
  unfazed_minio_data: